# herdr-plus worktree layout. Fires on every worktree herdr creates or opens
# (Ctrl-a G, ctrl+g in the projects picker, `herdr worktree create`) for any repo
# without a more specific `repo = "<name>"` file beside this one.
repo = "*"

[[tabs]]
name = "claude"
command = "claude"

[[tabs]]
name = "nvim"
command = "nvim"

[[tabs]]
name = "lazygit"
command = "lazygit"
