gui:
  nerdFontsVersion: '3'
  showBottomLine: false
  showListFooter: false
  showRootItemInFileTree: false
  theme:
    selectedLineBgColor:
      - '#393939'
  border: 'hidden'
  expandFocusedSidePanel: true
git:
  diffRenderers:
    - command: delta --paging=never
  # same format both sides: branch-scoped on <3>, whole repo on <a> from status
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --format=format:'%C(bold blue)%h%C(reset) - %C(bold green)(%ar)%C(reset)%C(bold yellow)%d%n%C(reset)%C(dim cyan)%an <%ae>%n%C(reset)%C(white)%w(0,4,4)%B%C(reset)' {{branchName}} --"
  allBranchesLogCmds:
    - "git log --graph --all --color=always --abbrev-commit --decorate --format=format:'%C(bold blue)%h%C(reset) - %C(bold green)(%ar)%C(reset)%C(bold yellow)%d%n%C(reset)%C(dim cyan)%an <%ae>%n%C(reset)%C(white)%w(0,4,4)%B%C(reset)'"
os:
  open: 'open -R {{filename}}'
  editPreset: 'nvim-remote'
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'
notARepository: 'quit'
promptToReturnFromSubprocess: false
keybinding:
  universal:
    copyToClipboard: 'y'
customCommands:
  # C in Files (replaces built-in "commit with git editor"; use `c` then `e` for that):
  # Claude (haiku) proposes 5 Conventional Commit subjects from the staged diff
  # -> pick one -> nvim opens `git commit` prefilled to refine/add a body.
  - key: 'C'
    context: 'files'
    description: 'AI commit message (Claude)'
    prompts:
      - type: 'menuFromCommand'
        title: 'AI commit message'
        key: 'Msg'
        command: >-
          sh -c 'git diff --cached --quiet && { echo "nothing staged" >&2; exit 1; };
          git diff --cached | claude -p --model haiku --tools "" --strict-mcp-config --no-session-persistence
          "Write 5 alternative git commit subject lines for the staged diff on stdin.
          Conventional Commits format: type(optional scope): summary, imperative mood, max 72 chars.
          Output exactly 5 lines, one message per line, nothing else: no numbering, bullets, quotes, backticks, or blank lines."'
        filter: '^(?P<msg>\S.*)$'
        valueFormat: '{{ .msg }}'
        labelFormat: '{{ .msg | green }}'
    command: 'GIT_EDITOR=nvim git commit --edit -m {{.Form.Msg | quote}}'
    output: terminal
