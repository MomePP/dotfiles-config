# vim: ft=tmux

set -g status on

# INFO: oxocarbon theme -- colors are the real palette from momepp/oxocarbon.nvim
# rather than approximated ANSI slots. ACCENT is `lavender`; swap it in one place
# to retheme the whole bar. Other purples in the fork: base14 #be95ff,
# periwinkle #b4befe, indigo #818cf8.
%hidden ACCENT="#cba6f7"
%hidden PINK="#ff7eb6"
%hidden DIM="#525252"

set -g status-position top
set -g status-style bg=default
set -g status-justify centre

# status-left and status-right MUST stay the same rendered width (45 columns).
# tmux centres the window list in the space BETWEEN left and right, not on the
# screen, so unequal sides drag the middle sideways -- each side shifts it by
# half the difference. Equal widths pin the middle to true screen centre.
#
#   left  = " working on " (12) + session field (33)              = 45
#   right = " agents " (8) + dots (5) + phrase (26) + state (5) + " " (1) = 45
#           phrase = " running " (9) + agent name + ", prefix " (9)
#
# Both sides read as sentences, so the phrase must stay tight -- padding the
# command directly would strand the comma out in whitespace. Instead the whole
# phrase is right-aligned with #{p-N:...}, which pads on the LEFT (undocumented
# but real), putting all the slack ahead of "running" where it is just a gap.
#
# The pad is 52, not 26: #[...] style tags count toward the pad budget, and the
# phrase carries two inline tags of 13 characters each. 26 + 26 = 52. Change a
# colour to anything but a 7-char hex and this number moves with it.
#
# The state word is deliberately OUTSIDE the pad. Its two branches carry style
# tags of different lengths (#[fg=#ff7eb6,bold] is 18, #[fg=#525252] is 13), so
# inside the pad the armed state would render 5 columns narrower than the idle
# one. Keep any replacement pair the same VISIBLE length: ready/armed are both 5.
#
# The agent dots are outside it for the same reason -- one tag pair per dot, so
# their budget cost moves with the agent count. The daemon pads them to a
# constant 5 visible columns instead, which is the only place that width is
# knowable.
#
# Fields are truncate-then-pad: #{p17:...} alone does NOT truncate, so a long
# name would overflow and break the balance. Chaining as #{p17:=17:...} silently
# yields blanks -- the inner format must be nested as #{p17:#{=17:...}}.
set -g status-left-length 50
set -g status-left "#[fg=${DIM}] working on#[fg=${PINK},bold] #{p33:#{=33:session_name}}"

set -g window-status-format "#[fg=${DIM}] #W "
set -g window-status-current-format "#[fg=${ACCENT},bold] #W "

# Right side shows what tmux surfaces nowhere else: prefix state is invisible by
# default, and the zoom flag is hidden because window-status-format omits #F.
# No clock (menu bar has it) and no hostname (single machine) -- both were filler.
#
# Both labels ALWAYS render and only change colour -- never conditional text.
# status-justify is `centre`, so tmux centres the window list in the space left
# over; a right side that changed width would drag the middle section sideways.
set -g status-right-length 50
# "running" names the agent when the window has one, else the foreground command
# -- `running claude` says more than `running zsh`, the shell it was launched
# through.
#
# The "agents" label blanks rather than disappears when a window has none: it is
# 8 columns, and a section that gives them up drags the window list sideways.
# Same reason the dots themselves are padded rather than omitted.
set -g status-right "#{?@tmux_agent_dock_window_agents,#[fg=${DIM}] agents ,        }#{@tmux_agent_dock_window_agents_fixed}#[fg=${DIM}]#{p-52:#{ running #[fg=${ACCENT}]#{=13:#{?@tmux_agent_dock_window_cli,#{@tmux_agent_dock_window_cli},#{pane_current_command}}}#[fg=${DIM}], prefix }}#{?client_prefix,#[fg=${PINK}#,bold]armed,#[fg=${DIM}]ready} "
