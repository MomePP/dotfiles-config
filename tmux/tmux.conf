# --- iterm tmux config
# add this to `send text at start on iterm profile`
#   `tmux attach-session || tmux new -s -default`

# enable color for tmux in Windows Terminal
# set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-kitty"
set -g default-terminal $TERM

# Reset to tmux's built-in defaults before appending. `set -as` appends, so
# without this every `source-file` reload stacks another copy -- these two
# options had grown to 60 and 58 entries of the same handful of rules.
set -gu terminal-features
set -gu terminal-overrides

set -as terminal-features ',xterm-256color*:RGB'
set -as terminal-features ',xterm-256color*:usstyle'
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys always

set -as terminal-overrides ',xterm*:Tc'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# reload config file (change file location to your the tmux.conf you want to use)
bind-key r source-file ~/.config/tmux/tmux.conf

# Session/Window tree
bind-key C-w choose-tree -Zw

# --- Session keybinds ---
bind-key N new-session
bind-key H switch-client -p
bind-key K switch-client -p
bind-key J switch-client -n
bind-key L switch-client -n
bind-key O switch-client -n
bind-key X kill-session

# --- Window keybinds ---
bind-key C-n new-window
bind-key C-k previous-window
bind-key C-h swap-window -t - \; previous-window
bind-key C-l swap-window -t + \; next-window
bind-key C-j next-window
bind-key C-o next-window
bind-key C-x kill-window

# --- Panes keybinds ---
# split panes using | and -
bind-key enter split-window -h
bind-key | split-window -h
bind-key _ split-window -v
bind-key x kill-pane
unbind '"'
unbind %

# switch panes using vim-like keys without prefix
# bind-key h select-pane -L
# bind-key l select-pane -R
# bind-key k select-pane -U
# bind-key j select-pane -D
bind-key k select-pane -t :.-
bind-key h select-pane -t :.-
bind-key j select-pane -t :.+
bind-key l select-pane -t :.+

# seamlessly switch tmux's panes and vim's split windows using vim-like keys without prefix
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#     | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
# bind-key -n M-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
# bind-key -n M-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
# bind-key -n M-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
# bind-key -n M-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# --- global settings ---
set -g mouse on
set-window-option -g mode-keys vi

# 1-based window/pane numbering, renumber windows on close
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Allow programs in tmux to use the Kitty graphics protocol (for Ghostty)
set -g allow-passthrough on

# Address vim mode switching delay
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 30000

# set -g pane-active-border-style fg=colour166,bg=default
# set -g window-style fg=colour10,bg=default
# set -g window-active-style fg=colour12,bg=default

#### COLOUR
# default statusbar colors
# set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
# set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
# set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
# set-option -g pane-border-style fg=colour235 #base02
# set-option -g pane-active-border-style fg=colour136,bg=colour235
#
# BORDER is base02, the same value nvim uses for WinSeparator, so a tmux split
# and an nvim split draw the same weight of line.
#
# The active border is deliberately just one step up the greyscale (base02 ->
# base03) rather than an accent colour. A split is a constant, ambient piece of
# chrome; colouring it lavender made it compete for attention. If the
# distinction is too faint, `ghost` #808080 is the next step.
#
# The conditional keeps the shape of tmux's built-in one so copy mode and
# synchronised panes still signal themselves. Those are rare, genuinely
# exceptional states, so they stay loud while the ordinary case stays quiet.
%hidden BORDER="#393939"
%hidden DIM="#525252"
set -g pane-border-style "fg=${BORDER}"
set -g pane-active-border-style "#{?pane_in_mode,fg=#ffab91,#{?synchronize-panes,fg=#ee5396,fg=${DIM}}}"

# message text
# set-option -g message-style bg=colour235,fg=colour166

# pane number display
# set-option -g display-panes-active-colour colour33 #blue
# set-option -g display-panes-colour colour166 #orange

# clock
# set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles off
# set -g set-titles-string "#T"

# name each window after its current directory, not the running process.
# tmux-agent-dock reads window_name for its session rows, so this is what
# makes the sidebar show directories. Lived in tmux.powerline.conf until the
# status line was dropped -- keep it here so it survives a server restart.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Powerline
source ~/.config/tmux/tmux.powerline.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'MomePP/tmux-agent-dock'

# tmux-continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# tmux-resurrect
set -g @resurrect-strategy-nvim 'session'
# Resurrect snapshots every pane it can see, including two it must not bring
# back: the agent-dock sidebar (restores as a dead 30-column shell) and
# sidekick.nvim's `<tool> <cwd-hash>` agent sessions (restore as empty shells
# in the dock's session list). This hook gets the save file before it becomes
# `last`, so the next 60-second tick also cleans up an already-polluted save.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-filter.sh'

# tmux-agent-dock
# Only what differs from the plugin's own defaults: popup C-n, sidebar view and
# `keys` input are already the defaults, and the view/input pair is sticky anyway
# (the launcher prefers the last-toggled @tmux_agent_dock_* over these), so
# setting them bought nothing.
set -g @agent_dock_nav 'off'        # vim-aware C-h/C-j/C-k/C-l nav (default: on)
set -g @agent_dock_tab_status 'off' # show agent state in tmux window tabs (default: on)

# The status line: off while the sidebar said the same things; on again now that
# the row carries what nothing else does -- the agents in this window and which
# one wants you.
#
# Continuum saves either way. tmux has no timer, so continuum normally hangs its
# save off a `#()` in status-right; here it rides the dock daemon's tick, which
# runs for the life of the server whether this row is drawn or not.
# set -g status off
# Not a relative path: this runs from the daemon, whose working directory is
# inherited from whichever client happened to spawn it -- not something tmux.conf
# controls. TPM publishes its own directory instead, and the daemon inherits it.
# The fallback matters because the command is run detached with its output
# discarded, so a path resolving to nothing fails silently, which is exactly how
# continuum stops saving without telling you.
set -g @agent_dock_tick_command '${TMUX_PLUGIN_MANAGER_PATH:-$HOME/.config/tmux/plugins/}tmux-continuum/scripts/continuum_save.sh'
set -g @agent_dock_tick_interval '60'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

