# vim: ft=tmux

# if-shell 'test -z "$POWERLINE_CONFIG_COMMAND"' 'set-environment -g POWERLINE_CONFIG_COMMAND powerline-config'

# Don't version-check for this core functionality -- anything too old to
# support these options likely won't work well with powerline
# Keep this `on`: tmux-continuum runs its autosave via a #() interpolation in
# status-right, which tmux only evaluates when it draws the status line.
# Turning this off silently disables continuum's 15-minute autosave.
set -g status on
set-option -g status-style bg=default
