compression_level = "lite"
# The allowlist only logs. Commands are refused by
# ~/.config/claude-code/hooks/deny-shell-commands.sh, which Claude's PreToolUse
# hook and the OMP shell-guard extension run on every ctx_shell call.
shell_security = "warn"
shell_allowlist_extra = [
    "claude",
    "omp",
    "paseo",
    "tmux",
    "nvim",
    "open",
    "claude-settings-sync",
    "deny-git-identity-override.sh",
    "pio",
    "esptool",
    "esptool.py",
    "python",
    "python3",
    "caffeinate",
    "timeout",
    "git",
    "glab",
    "gh",
    "rsync",
    "node",
    "mkdir",
    "rmdir",
    "base64",
    "uhubctl",
]
# python/python3 are already allowed, so blocking `python -c` and heredocs adds
# little; agents can write the same code to a file and run it.
shell_allow_inline_scripts = true
# Paseo worktrees live outside each session's project root.
allow_paths = ["/Users/momeppkt/.paseo/worktrees"]
# lean-ctx's bundled registry stops at claude-opus-4-8 and falls back to 200k,
# which inflates context pressure 5x. OMP's model cache gives Opus 5.5 1M.
[model_context_windows]
"claude-opus-5-5" = 1000000

[telemetry]
enabled = false
preference = "explicitly_disabled"

[solution]
enabled = false
